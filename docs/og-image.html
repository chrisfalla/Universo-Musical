<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=1200" />
  <title>OG Image Template</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1200px;
      height: 630px;
      background: linear-gradient(135deg, #0A0A0A 0%, #1A3A6C 50%, #0A0A0A 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: 'Arial Black', 'Impact', sans-serif;
      position: relative;
      overflow: hidden;
    }
    .bg-notes {
      position: absolute;
      font-size: 120px;
      opacity: 0.06;
      color: #D4AF37;
    }
    .n1 { top: 40px; left: 80px; transform: rotate(-15deg); }
    .n2 { top: 80px; right: 100px; transform: rotate(10deg); }
    .n3 { bottom: 60px; left: 120px; transform: rotate(20deg); }
    .n4 { bottom: 100px; right: 80px; transform: rotate(-10deg); }
    .overlay-glow {
      position: absolute;
      width: 600px;
      height: 600px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(212,175,55,0.15), transparent 70%);
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
    }
    .logo {
      font-size: 72px;
      letter-spacing: 8px;
      color: #D4AF37;
      text-shadow: 0 0 60px rgba(212,175,55,0.3);
      margin-bottom: 16px;
      z-index: 1;
    }
    .tagline {
      font-size: 28px;
      color: rgba(255,255,255,0.85);
      letter-spacing: 4px;
      text-transform: uppercase;
      z-index: 1;
    }
    .subtitle {
      font-size: 18px;
      color: rgba(255,255,255,0.5);
      margin-top: 24px;
      font-family: Arial, sans-serif;
      letter-spacing: 2px;
      z-index: 1;
    }
    .divider {
      width: 80px;
      height: 2px;
      background: #D4AF37;
      margin: 20px 0;
      z-index: 1;
    }
  </style>
</head>
<body>
  <div class="bg-notes n1">♪</div>
  <div class="bg-notes n2">♫</div>
  <div class="bg-notes n3">♩</div>
  <div class="bg-notes n4">♬</div>
  <div class="overlay-glow"></div>
  <div class="logo">UNIVERSO MUSICAL</div>
  <div class="divider"></div>
  <div class="tagline">Donde la Música Cobra Vida</div>
  <div class="subtitle">Neiva, Huila — Instrumentos · Clases · Eventos</div>
</body>
</html>
